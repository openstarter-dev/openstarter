<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>OpenStarter</title>
    <style>
    html,
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      margin: 0;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f5f5f5;
      background: #0a0a0a;
    }
    main {
      max-width: 28rem;
      padding: 2rem;
      text-align: center;
    }
    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
    }
    p {
      line-height: 1.5;
      color: #a3a3a3;
    }
    button {
      padding: 0.5rem 1.5rem;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: #f5f5f5;
      cursor: pointer;
      background: #171717;
      border: 1px solid #404040;
      border-radius: 0.375rem;
    }
    button:hover {
      background: #262626;
    }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Can't reach the app</h1>
      <p id="message">Check your internet connection, then try again.</p>
      <button id="retry-button" type="button">Retry</button>
    </main>
    <script>
    "use strict";
    const params = new URLSearchParams(window.location.search);
    const reason = params.get("reason");
    if (reason === "config") {
      document.getElementById("title").textContent = "App URL not configured";
      document.getElementById("message").textContent =
        "The desktop app doesn't have a valid site URL configured. Set OPENSTARTER_API_URL or rebuild with a valid default URL.";
    }
    document.getElementById("retry-button").addEventListener("click", () => {
      window.desktop?.retry();
    });
    </script>
  </body>
</html>
