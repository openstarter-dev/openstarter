packages:
  - apps/*
  - packages/*
  - packages/*/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true

# catalog 只放「跨包必须同版本」的依赖：
#   - 多个 workspace 包共用（react / typescript / hono / zod ...）
#   - 单包使用但版本强耦合的家族（@better-auth/* 必须与 better-auth 核心同版本）
# 只有单一消费方的库直接写在该包 package.json 里，不再经过 catalog。
catalog:
  # better-auth 家族：插件与核心必须严格同版本，即使当前只有一个包引用也留在这里
  "@better-auth/api-key": 1.7.22
  "@better-auth/drizzle-adapter": 1.7.22
  "@better-auth/expo": 1.7.22
  "@better-auth/passkey": 1.7.22
  better-auth: 1.7.22

  # 渲染层：web / desktop / extension / mini-app / email / ui-* 共享同一套版本
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.3
  react: 19.2.7
  react-dom: 19.2.7
  lucide-react: 0.546.0
  next-themes: 0.4.6

  # 工具链 / 运行时：全仓统一
  "@tanstack/react-start": ^1.167.41
  "@types/node": ^22.13.14
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  dotenv: ^17.2.2
  drizzle-orm: ^0.45.1
  envin: ^1.2.0
  fast-check: 4.9.0
  hono: 4.13.8
  tailwind-merge: ^3.5.0
  typescript: ^6
  zod: ^4.1.13

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - workerd
  - electron
  - "@tarojs/binding"
  - "@tarojs/cli"
  - core-js
  - core-js-pure
