packages:
  - apps/*
  - packages/*
  - packages/*/*

allowBuilds:
  esbuild: true
  msw: true
  sharp: true
  workerd: true

catalog:
  "@types/react": 19.2.17
  "@types/react-dom": ^19.2.3
  react: 19.2.7
  react-dom: 19.2.7

  "@types/node": ^22.13.14
  dotenv: ^17.2.2
  drizzle-orm: ^0.45.1
  envin: ^1.2.0
  fast-check: 4.9.0
  typescript: ^6
  zod: ^4.1.13

onlyBuiltDependencies:
  - esbuild
  - msw
  - sharp
  - workerd
  - electron
  - "@tarojs/binding"
  - "@tarojs/cli"
  - core-js
  - core-js-pure
