name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.ref }}

jobs:
  lint-format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting and lint
        run: |
          pnpm format:check
          pnpm lint
      - name: Check package boundaries
        run: pnpm turbo boundaries

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --affected diffs against the base branch and needs the merge base,
          # which a shallow clone usually lacks.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - name: Setup turbo cache
        uses: rharkor/caching-for-turbo@v1.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Coverage in a single pass — test and test:coverage run the same suites,
      # so running both would execute every test twice.
      - name: Run tests with coverage
        run: pnpm turbo run test:coverage ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --affected diffs against the base branch and needs the merge base,
          # which a shallow clone usually lacks.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - name: Setup turbo cache
        uses: rharkor/caching-for-turbo@v1.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check types
        run: pnpm turbo run check-types ${{ github.event_name == 'pull_request' && '--affected' || '' }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --affected diffs against the base branch and needs the merge base,
          # which a shallow clone usually lacks.
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22
      - name: Setup turbo cache
        uses: rharkor/caching-for-turbo@v1.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Node target
        run: pnpm turbo run build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
      - name: Build Cloudflare target
        if: github.event_name == 'push'
        run: pnpm turbo run cf:build --filter=web
